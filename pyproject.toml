[project]
name = "tripo-mcp"
version = "0.3.0"
description = "MCP server that generates 3D models with Tripo AI and saves them to disk"
authors = [
    {name = "Allen Dang", email = "allen@vastai3d.com"},
    {name = "pookiefoof", email = "caoyanpei@gmail.com"},
    {name = "Ding Liang", email = "liangding@vastai3d.com"},
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
keywords = ["mcp", "tripo", "3d", "glb", "automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
]

dependencies = [
    "tripo3d>=1.0,<2",
    "mcp[cli]>=1.4.1,<2",
]

[project.optional-dependencies]
dev = [
]

[project.scripts]
tripo-mcp = "server:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
